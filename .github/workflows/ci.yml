name: CI, Package Build & APT Repository

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  schedule:
    # Check and sync upstream external packages daily at 04:00 UTC
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [ rpi-suspend-release, update-external-packages ]
  workflow_dispatch:

# Default to read-only. The deploy job requests the extra scopes it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Packages
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev apt-utils shellcheck python3 device-tree-compiler
          if [ "$(uname -m)" != "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Syntax & Lint check
        run: |
          echo "=== Checking Python syntax ==="
          python3 -m py_compile src/argon-oneup-power-profiles/usr/sbin/argon-oneup-power-profiles
          python3 -m py_compile src/argon-oneup-power-profiles/usr/bin/powerprofilesctl
          python3 -m py_compile extras/ksystemstats-rpi5-fix/usr/sbin/ksystemstats-rpi5-fix
          python3 -m py_compile src/cm5-mmc-fix/usr/bin/cm5-mmc-fix
          python3 -m py_compile src/argon-oneup-battery/usr/bin/argon-power-bench
          python3 -m py_compile extras/rpi-pishutdown/usr/bin/rpi-pishutdown

          echo "=== Checking Shell syntax ==="
          bash -n build_packages.sh
          bash -n scripts/build_apt_repo.sh
          find src extras -type f -name "postinst" -exec bash -n {} +
          find src extras -type f -name "postrm" -exec bash -n {} +
          find src extras -type f -name "prerm" -exec bash -n {} +
          bash -n src/argon-oneup-backlight/usr/sbin/argon-backlight-init
          bash -n extras/ksystemstats-rpi5-fix/usr/bin/ksystemstats-cpuinfo-gen
          sh -n src/argon-oneup-essentials/usr/sbin/argon-essentials-apply

      - name: Build Debian packages
        run: |
          chmod +x build_packages.sh
          ./build_packages.sh

      - name: Verify package integrity
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          for deb in *.deb extras/*.deb; do
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

      - name: Generate Build Summary Dashboard
        if: always()
        run: |
          echo "## ⚡ Argon ONE UP Suite – Build & Package Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture / Runner:** \`$(uname -m)\` ($(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2 | tr -d '\"'))" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** \`${{ github.ref }}\` (\`${{ github.sha }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paket | Architektur | Version | Größe |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for deb in dist/*.deb dist/extras/*.deb; do
            [ -f "$deb" ] || continue
            pkg_name=$(dpkg-deb -f "$deb" Package)
            pkg_ver=$(dpkg-deb -f "$deb" Version)
            pkg_arch=$(dpkg-deb -f "$deb" Architecture)
            pkg_size=$(du -h "$deb" | awk '{print $1}')
            echo "| \`$pkg_name\` | \`$pkg_arch\` | \`$pkg_ver\` | $pkg_size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 SHA256 Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat dist/SHA256SUMS >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argon-oneup-packages
          path: dist

  deploy:
    name: Sign & Deploy APT Repository
    needs: build
    runs-on: ubuntu-24.04-arm
    # Never run untrusted PR code with secrets or write permissions.
    # Forks can opt in by setting the repository variable DEPLOY_APT=true
    # and adding the APT_GPG_PRIVATE_KEY secret.
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.repository == 'GamingTux/argon-oneup-suite' || vars.DEPLOY_APT == 'true')
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: argon-oneup-packages
          path: dist

      - name: Import GPG Key for APT Signing
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_KEY" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is required when APT deployment is enabled."
            exit 1
          fi
          echo "$APT_GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Generate APT Repository
        env:
          # Optional: set the GPG_KEY_ID repository variable to use a signing
          # key whose UID is not "Argon ONE UP" (forks with their own key).
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          chmod +x scripts/build_apt_repo.sh
          ./scripts/build_apt_repo.sh

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Argon ONE UP Suite ${{ github.ref_name }}"
          files: |
            dist/*.deb
            dist/extras/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
